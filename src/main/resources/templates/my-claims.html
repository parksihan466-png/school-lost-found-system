<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Claims</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="site-header">
        <div class="container nav">
            <div class="brand">School Lost & Found</div>
            <nav>
                <a th:href="@{/}">Home</a>
                <a th:href="@{/report-lost}">Report Lost Item</a>
                <a th:href="@{/report-found}">Report Found Item</a>
                <a th:href="@{/lost-items}">Browse Items</a>
                <a th:if="${currentUser != null}" th:href="@{/my-reports}">My Reports</a>
                <a th:if="${currentUser == null}" th:href="@{/login}">Login</a>
                <a th:if="${currentUser == null}" th:href="@{/register}">Register</a>
                <a th:if="${currentUser != null}" th:href="@{/logout}">Logout</a>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <h1>My Claims</h1>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Notes</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="claim : ${claims}">
                            <td>[[${claim.item.title}]]</td>
                            <td>[[${claim.notes}]]</td>
                            <td>
                                <span th:if="${claim.status.name() == 'PENDING'}" class="chip">Pending</span>
                                <span th:if="${claim.status.name() == 'APPROVED'}" class="chip success">Approved</span>
                                <span th:if="${claim.status.name() == 'REJECTED'}" class="chip danger">Rejected</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
