<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Report Lost Item</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container section form-page">
        <h1>Report Lost Item</h1>
        <form th:action="@{/report-lost}" method="post" th:object="${item}" class="form-card" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-group">
                <label>Item Title</label>
                <input type="text" th:field="*{title}" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <input type="text" th:field="*{category}" required>
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" th:field="*{locationFound}" required>
            </div>
            <div class="form-group">
                <label>Upload Image</label>
                <input type="file" name="imageFile" accept="image/*">
            </div>
            <div class="form-group">
                <label>Image URL (optional)</label>
                <input type="text" th:field="*{imageUrl}">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea th:field="*{description}" rows="5" required></textarea>
            </div>
            <button class="button primary" type="submit">Submit Report</button>
        </form>
    </div>
</body>
</html>
