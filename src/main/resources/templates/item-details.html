<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Details</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="site-header">
        <div class="container nav">
            <div class="brand">School Lost & Found</div>
            <nav>
                <a th:href="@{/}">Home</a>
                <a th:href="@{/report-lost}">Report Lost Item</a>
                <a th:href="@{/report-found}">Report Found Item</a>
                <a th:href="@{/lost-items}">Browse Items</a>
                <a th:if="${currentUser != null}" th:href="@{/my-reports}">My Reports</a>
                <a th:if="${currentUser == null}" th:href="@{/login}">Login</a>
                <a th:if="${currentUser == null}" th:href="@{/register}">Register</a>
                <a th:if="${currentUser != null}" th:href="@{/logout}">Logout</a>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container detail-layout">
            <div class="detail-image">
                <img th:if="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}" th:src="@{${item.imageUrl}}" alt="Item image">
                <img th:if="${item.imageUrl == null or #strings.isEmpty(item.imageUrl)}" th:src="@{/images/default-item.jpg}" alt="Default item image">
            </div>

            <div class="detail-content">
                <h1>[[${item.title}]]</h1>
                <div class="chip" th:classappend="${item.itemType.name() == 'LOST'} ? ' lost' : ' found'">[[${item.itemType}]]</div>
                <p>[[${item.description}]]</p>
                <div><strong>Category:</strong> [[${item.category}]]</div>
                <div><strong>Location:</strong> [[${item.locationFound}]]</div>
                <div><strong>Reported:</strong> [[${item.dateReported}]]</div>

                <form th:action="@{/claim}" method="post" class="claim-form">
                    <input type="hidden" name="itemId" th:value="${item.id}">
                    <div class="form-group">
                        <label for="notes">Provide claim details</label>
                        <textarea id="notes" name="notes" rows="4" required></textarea>
                    </div>
                    <button class="button primary full" type="submit">Submit Claim</button>
                </form>

                <form th:action="@{/send-message}" method="post" class="claim-form">
                    <input type="hidden" name="itemId" th:value="${item.id}">
                    <input type="hidden" name="receiverId" th:value="${receiverId}">
                    <div class="form-group">
                        <label for="content">Send a message to the reporter</label>
                        <textarea id="content" name="content" rows="4" required></textarea>
                    </div>
                    <button class="button primary full" type="submit">Send Message</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
