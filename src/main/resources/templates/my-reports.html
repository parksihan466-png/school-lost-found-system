<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reports</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="site-header">
        <div class="container nav">
            <div class="brand">School Lost & Found</div>
            <nav>
                <a th:href="@{/}">Home</a>
                <a th:href="@{/report-lost}">Report Lost Item</a>
                <a th:href="@{/report-found}">Report Found Item</a>
                <a th:href="@{/lost-items}">Browse Items</a>
                <a th:if="${currentUser != null}" th:href="@{/my-reports}">My Reports</a>
                <a th:if="${currentUser == null}" th:href="@{/login}">Login</a>
                <a th:if="${currentUser == null}" th:href="@{/register}">Register</a>
                <a th:if="${currentUser != null}" th:href="@{/logout}">Logout</a>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <h1>My Reports</h1>

            <div th:if="${successMessage}" class="alert success">
                [[${successMessage}]]
            </div>

            <div class="card-grid">
                <div class="item-card" th:each="item : ${items}">
                    <img th:if="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}" th:src="@{${item.imageUrl}}" alt="Item image">
                    <img th:if="${item.imageUrl == null or #strings.isEmpty(item.imageUrl)}" th:src="@{/images/default-item.jpg}" alt="Default item image">
                    <div class="item-body">
                        <span class="chip" th:classappend="${item.itemType.name() == 'LOST'} ? ' lost' : ' found'">[[${item.itemType}]]</span>
                        <h3>[[${item.title}]]</h3>
                        <p>[[${item.description}]]</p>
                        <div><strong>Category:</strong> [[${item.category}]]</div>
                        <div><strong>Location:</strong> [[${item.locationFound}]]</div>
                        <a th:href="@{/items/{id}(id=${item.id})}">View details</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
