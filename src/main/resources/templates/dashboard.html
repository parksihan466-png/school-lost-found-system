<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="site-header">
        <div class="container nav">
            <div class="brand">School Lost & Found</div>
            <nav>
                <a th:href="@{/}">Home</a>
                <a th:href="@{/report-lost}">Report Lost Item</a>
                <a th:href="@{/report-found}">Report Found Item</a>
                <a th:href="@{/lost-items}">Browse Items</a>
                <a th:if="${currentUser != null}" th:href="@{/my-reports}">My Reports</a>
                <a th:if="${currentUser == null}" th:href="@{/login}">Login</a>
                <a th:if="${currentUser == null}" th:href="@{/register}">Register</a>
                <a th:if="${currentUser != null}" th:href="@{/logout}">Logout</a>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <h1>Dashboard</h1>
            <div class="dashboard-grid">
                <div class="stat-box">
                    <span>Lost items</span><br>
                    <strong>[[${lostCount}]]</strong>
                </div>
                <div class="stat-box">
                    <span>Found items</span><br>
                    <strong>[[${foundCount}]]</strong>
                </div>
                <div class="stat-box">
                    <span>Claims</span><br>
                    <strong>[[${claimCount}]]</strong>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
