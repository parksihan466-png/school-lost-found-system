<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register | Lost & Found</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-card">
            <h1>Create Account</h1>
            <p th:if="${errorMessage}" class="alert error" th:text="${errorMessage}">Error</p>
            <p th:if="${successMessage}" class="alert success" th:text="${successMessage}">Success</p>
            <form th:action="@{/register}" method="post" th:object="${user}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" th:field="*{fullName}" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" required>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" th:field="*{username}" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" th:field="*{password}" required>
                </div>
                <button class="button primary full" type="submit">Register</button>
            </form>
            <p class="auth-link">Already have an account? <a th:href="@{/login}">Login</a></p>
        </div>
    </div>
</body>
</html>
