<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Lost Item</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="site-header">
        <div class="container nav">
            <div class="brand">School Lost & Found</div>
            <nav>
                <a th:href="@{/}">Home</a>
                <a th:href="@{/report-lost}">Report Lost Item</a>
                <a th:href="@{/report-found}">Report Found Item</a>
                <a th:href="@{/lost-items}">Browse Items</a>
                <a th:if="${currentUser != null}" th:href="@{/my-reports}">My Reports</a>
                <a th:if="${currentUser == null}" th:href="@{/login}">Login</a>
                <a th:if="${currentUser == null}" th:href="@{/register}">Register</a>
                <a th:if="${currentUser != null}" th:href="@{/logout}">Logout</a>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container form-page">
            <div class="form-card">
                <h1>Report Lost Item</h1>
                <form th:action="@{/report-lost}" method="post" th:object="${item}" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="title">Item Name</label>
                        <input id="title" th:field="*{title}" type="text" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <input id="category" th:field="*{category}" type="text" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" th:field="*{description}" rows="5"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="locationFound">Location Lost</label>
                        <input id="locationFound" th:field="*{locationFound}" type="text" required>
                    </div>
                    <div class="form-group">
                        <label for="imageFile">Upload Image</label>
                        <input id="imageFile" name="imageFile" type="file" accept="image/*">
                    </div>
                    <button class="button primary full" type="submit">Submit Report</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
