<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | Lost & Found</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p th:if="${errorMessage}" class="alert error" th:text="${errorMessage}">Error</p>
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button class="button primary full" type="submit">Login</button>
            </form>
            <p class="auth-link">Need an account? <a th:href="@{/register}">Register here</a></p>
            <p class="note">Demo credentials: admin / admin123</p>
        </div>
    </div>
</body>
</html>
