<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Claims</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="site-header">
        <div class="container nav">
            <div class="brand">School Lost & Found</div>
            <nav>
                <a th:href="@{/dashboard}">Dashboard</a>
                <a th:href="@{/my-reports}">My Reports</a>
                <a th:href="@{/my-claims}">My Claims</a>
                <a th:href="@{/messages}">Messages</a>
            </nav>
        </div>
    </header>

    <main class="container section">
        <h1>My Claims</h1>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Notes</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="claim : ${claims}">
                        <td th:text="${claim.item.title}">Item</td>
                        <td th:text="${claim.notes}">Notes</td>
                        <td th:text="${claim.status}">Status</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
